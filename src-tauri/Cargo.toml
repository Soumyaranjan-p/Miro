[package]
name = "miro"
version = "0.1.0"
description = "Miro - local-first voice typing for Windows"
authors = ["Miro"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
default-run = "miro"

[lib]
# Desktop-only app: the lib target exists so integration tests and the
# `insertion-probe` binary can exercise real code paths, not copies of them.
name = "miro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# audio capture; the resampler to 16 kHz mono is ours (see src/audio/resample.rs)
cpal = "0.18"

# Local speech recognition. whisper.cpp is C++, so it is a default-on feature:
# `--no-default-features` still builds Miro, which then reports
# `engine_unavailable` honestly instead of pretending to transcribe.
whisper-rs = { version = "0.16", optional = true, default-features = false }

# model downloads only (user-confirmed). ureq is blocking, which matches what
# this actually is - one file, one thread - and `native-tls` means Windows'
# own TLS stack: no OpenSSL, no rustls, no aws-lc C library to build or trust.
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }

thiserror = "2"
zeroize = "1"

# Local calendar date for the daily usage statistics buckets.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[features]
default = ["engine-whisper"]
engine-whisper = ["dep:whisper-rs"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_ProcessStatus",
    "Win32_System_Console",
    "Win32_Security_Cryptography",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
] }

# whisper.cpp is C++ and slow when unoptimized; keep our own code debuggable
# while dependencies stay fast enough for real transcription during `tauri dev`.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
